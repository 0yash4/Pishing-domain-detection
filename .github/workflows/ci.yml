name: CI Pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository (full history)
      uses: actions/checkout@v4

    - name: Fetch full repository from GitHub
      run: git fetch --unshallow  # Ensures complete repo history is pulled

    - name: Install Git LFS
      run: sudo apt-get install -y git-lfs

    - name: Initialize and pull LFS-tracked files
      run: |
        git lfs install
        git lfs pull
        ls -lh artifacts/  # Verify model.pkl is correctly downloaded

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASS }}

    - name: Build the Docker image
      run: sudo docker build -t 0yash4/fastapi_pishing_domain:latest .

    - name: Push to Docker Hub
      run: sudo docker push 0yash4/fastapi_pishing_domain:latest

    - name: Deleting all Docker images available in the system
      run: sudo docker rmi -f $(sudo docker images -aq)

