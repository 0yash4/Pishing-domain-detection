name: CI Pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository (full history)
      uses: actions/checkout@v4

    - name: Fetch full repository from GitHub
      run: git fetch --unshallow

    - name: Install Git LFS
      run: sudo apt-get install -y git-lfs

    - name: Initialize and pull LFS-tracked files
      run: |
        git lfs install
        git lfs pull

    - name: Verify model.pkl exists
      run: ls -lh artifacts/

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
    
    - name: Verify Docker Login
      run: docker info | grep -i "username"

    - name: Build the Docker image
      run: sudo docker build -t 0yash4/fastapi_pishing_domain:latest .

    - name: Push to Docker Hub
      run: sudo docker push 0yash4/fastapi_pishing_domain:latest

