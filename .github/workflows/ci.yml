name: CI Pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository (full history)
      uses: actions/checkout@v4

    - name: Fetch full repository from GitHub
      run: git fetch --unshallow

    - name: Install Git LFS
      run: sudo apt-get install -y git-lfs

    - name: Initialize and pull LFS-tracked files
      run: |
        git lfs install
        git lfs pull

    - name: Verify model.pkl exists
      run: ls -lh artifacts/

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASS }}
    
    - name: Verify Docker Login
      run: docker info | grep -i "username"

    - name: Build the Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/fastapi_pishing_domain:latest .

    - name: Push to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/fastapi_pishing_domain:latest

#working fine now